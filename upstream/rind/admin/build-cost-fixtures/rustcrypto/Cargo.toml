[package]
name = "build-cost-rustcrypto"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, so it resolves and builds alone.
[workspace]

[dependencies]
aes-gcm = "0.11"
p256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["getrandom"] }
