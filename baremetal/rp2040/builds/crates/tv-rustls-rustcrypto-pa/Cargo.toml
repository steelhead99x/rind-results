[package]
name = "tv-rustls-rustcrypto-pa"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rustls-rustcrypto = { version = "=0.1.0-pre.0", default-features = false, features = ["alloc", "tls12"] }
once_cell = { version = "1.21", default-features = false, features = ["race", "portable-atomic"] }
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }
