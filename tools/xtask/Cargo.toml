# SPDX-License-Identifier: Apache-2.0 OR ISC OR MIT-0
[package]
name = "xtask"
version = "0.1.0"
description = "Generates rind-results' tables, JSON, charts, OLED data and media from the raw board runs"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
png = "0.17"
pulldown-cmark = { version = "0.11", default-features = false, features = ["html"] }
regex = "1.13"
sha2 = "0.10"
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }
android-convert = { path = "../android-convert" }
render-side = { path = "../render-side" }
stage-repo = { path = "../stage-repo" }
serialport = { version = "4", default-features = false }
toml = "0.8"
