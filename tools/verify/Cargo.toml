[package]
name = "verify"
version = "0.1.0"
description = "Independent re-check of rind-results' published numbers from the raw runs; shares no code with xtask"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
regex = "1.13"
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }
