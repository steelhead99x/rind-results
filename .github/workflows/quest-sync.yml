name: quest-sync

on:
  push:
    branches: [main]
    paths: ["quests/**", "tools/quest-sync.py"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quest-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sync quest issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/quest-sync.py
