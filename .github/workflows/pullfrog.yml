# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        uses: pullfrog/pullfrog@44b58efe7fe431053c58aafa05e51e190f969685 # v0
        with:
          prompt: ${{ inputs.prompt }}
        # Fallback only. The ChatGPT Codex credential from
        # `npx pullfrog auth codex` stays in Pullfrog's encrypted store.
        # This file does not create a secret; an unset OPENAI_API_KEY is empty.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
