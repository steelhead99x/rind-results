# The decision on every gap on the jetson-orin-nano host: each report operation
# where another library (OpenSSL included) beats rind by more than 10%, in
# rind's benchmarks/gaps.toml format. `cargo xtask host-report` refuses a gap
# without an entry and an entry that covers no gap.
#
# None: on the medians of the three runs no library is more than 10% faster
# than rind on any operation (the closest is sha256/64B, where RustCrypto is
# about 7% faster; see RESULTS.md).
